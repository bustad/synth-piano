<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Crossing</title>
<style>
  :root {
    --gold:  #ffe9a0;
    --ice:   #b8c4f0;
    --edge:  #8a9ad0;
    --edge2: #c8d2f4;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    overflow: hidden;
    background: linear-gradient(#070b24, #2a2860 55%, #5d4a7a);
    color: #eef;
    font-family: "Trebuchet MS", Verdana, Tahoma, sans-serif;
    -webkit-user-select: none;
            user-select: none;
  }

  /* ---------- 3D view, rendered at low resolution then scaled up ---------- */
  #stage { position: fixed; inset: 0; }
  #stage canvas {
    display: block;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    cursor: grab;
  }

  .vig {
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  }

  /* ---------- 2002-style HUD plates ---------- */
  .plate, .panel, .hint {
    background: linear-gradient(rgba(34,40,84,.78), rgba(10,12,32,.82));
    border: 1px solid var(--edge);
    border-top-color: var(--edge2);
    border-left-color: var(--edge2);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.65), 0 4px 14px rgba(0,0,0,.55);
    border-radius: 4px;
  }

  .plate {
    position: fixed;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    padding: 7px 30px 9px;
    text-align: center;
    white-space: nowrap;
  }
  .plate h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--gold);
    text-shadow:
      1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000,
      0 0 12px rgba(255,200,90,.55);
  }
  .plate p { margin: 2px 0 0; font-size: 12px; letter-spacing: 1px; color: var(--ice); }

  .panel {
    position: fixed;
    left: 14px; bottom: 14px;
    width: 210px;
    overflow: hidden;
  }
  .panel h2 {
    margin: 0;
    padding: 3px 10px 4px;
    font-size: 12px;
    letter-spacing: 1px;
    color: #fff;
    background: linear-gradient(#5568b8, #26306a);
    border-bottom: 1px solid #000;
    text-shadow: 1px 1px 0 #000;
  }
  .panel ul { list-style: none; margin: 0; padding: 5px; }
  .panel a {
    position: relative;
    display: block;
    padding: 5px 8px 5px 24px;
    font-size: 14px;
    color: #d6defa;
    text-decoration: none;
    border: 1px solid transparent;
    outline: none;
  }
  .panel a::before {
    content: "";
    position: absolute; left: 9px; top: 50%;
    width: 7px; height: 7px;
    margin-top: -4px;
    transform: rotate(45deg);
    background: linear-gradient(135deg, #fff4c0, #b8841c);
    border: 1px solid #000;
  }
  .panel a:hover,
  .panel a:focus-visible {
    color: #fff;
    background: rgba(120,150,255,.28);
    border-color: var(--edge);
    text-shadow: 1px 1px 0 #000;
  }

  .hint {
    position: fixed;
    left: 50%; bottom: 18px;
    transform: translateX(-50%);
    padding: 5px 16px 6px;
    font-size: 13px;
    white-space: nowrap;
    color: #eef;
    text-shadow: 1px 1px 0 #000;
    pointer-events: none;
  }
  .hint b { color: var(--gold); font-weight: bold; }

  #walk {
    display: none;
    position: fixed;
    right: 18px; bottom: 18px;
    width: 68px; height: 68px;
    border-radius: 50%;
    border: 2px solid var(--edge2);
    background: radial-gradient(circle at 35% 30%, #6a7cd0, #1c2460 70%);
    color: #fff;
    font-size: 26px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.6), 0 4px 12px rgba(0,0,0,.6);
    touch-action: none;
  }
  #walk:active { background: radial-gradient(circle at 35% 30%, #9aa8f0, #2c3a90 70%); }
  @media (pointer: coarse) { #walk { display: block; } }

  /* ---------- Fade to black while the next page loads ---------- */
  #fade {
    position: fixed; inset: 0;
    background: #000;
    color: var(--gold);
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 1px 1px 0 #000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .45s ease-in;
  }
  #fade.on { opacity: 1; pointer-events: all; }

  /* ---------- Fallback when WebGL or three.js isn't available ---------- */
  body.nogl #stage, body.nogl .hint, body.nogl #walk, body.nogl .vig { display: none; }
  body.nogl .panel {
    left: 50%; top: 50%; bottom: auto;
    transform: translate(-50%, -50%);
    width: min(320px, 90vw);
  }
  body.nogl .panel a { font-size: 18px; padding-top: 9px; padding-bottom: 9px; }

  @media (max-width: 700px) {
    .plate h1 { font-size: 20px; }
    .panel { width: 168px; left: 8px; bottom: 8px; }
    .panel a { font-size: 13px; padding-top: 4px; padding-bottom: 4px; }
    .hint { bottom: auto; top: 74px; font-size: 12px; max-width: calc(100vw - 16px); white-space: normal; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    #fade { transition-duration: .01s; }
  }
</style>
<noscript>
  <style>
    .panel { left: 50%; top: 50%; bottom: auto; transform: translate(-50%, -50%); width: min(320px, 90vw); }
    .hint, #walk { display: none; }
  </style>
</noscript>
</head>
<body>

<div id="stage"></div>
<div class="vig"></div>

<header class="plate">
  <h1>The Crossing</h1>
  <p>Walk through a gate</p>
</header>

<!--
  ============================================================
  EDIT HERE: this list is the single source of truth. The 3D
  world builds one gate per link, in this order, using the
  link text as the sign above the gate. Change href="" to your
  own .html files. Add or remove <li> items freely (1 to 12).
  This list also works as a plain menu if 3D isn't available.
  ============================================================
-->
<nav class="panel" aria-label="Gates">
  <h2>Gates</h2>
  <ul id="gates">
    <li><a href="page1.html">Town Square</a></li>
    <li><a href="page2.html">The Archives</a></li>
    <li><a href="page3.html">Mountain Pass</a></li>
    <li><a href="page4.html">Harbor</a></li>
    <li><a href="page5.html">Workshop</a></li>
    <li><a href="page6.html">Secret Level</a></li>
  </ul>
</nav>

<div class="hint" id="hint"></div>
<button id="walk" aria-label="Walk forward">&#9650;</button>
<div id="fade"><span></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var links  = [].slice.call(document.querySelectorAll('#gates a'));
  var N      = links.length;
  var stage  = document.getElementById('stage');
  var fade   = document.getElementById('fade');
  var hint   = document.getElementById('hint');
  var walkBtn = document.getElementById('walk');

  if (typeof THREE === 'undefined' || !N) { document.body.classList.add('nogl'); return; }

  var renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: false }); }
  catch (e) { document.body.classList.add('nogl'); return; }
  if (!renderer.getContext()) { document.body.classList.add('nogl'); return; }

  var canvas  = renderer.domElement;
  stage.appendChild(canvas);

  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var touch   = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  var HINT_DEFAULT = touch
    ? 'Drag to look. Tap a gate. Hold the arrow to walk.'
    : '<b>W A S D</b> walk &nbsp; <b>Drag</b> look &nbsp; <b>Click</b> a gate, or walk into one';
  hint.innerHTML = HINT_DEFAULT;

  /* ---------- tiny seeded random so the world is the same every visit ---------- */
  var seed = 1337;
  function rand() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }

  /* ---------- scene, camera, fog ---------- */
  var FOG = 0x5d4a7a;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(FOG);
  scene.fog = new THREE.Fog(FOG, 14, 88);

  var camera = new THREE.PerspectiveCamera(72, 1, 0.1, 400);
  camera.rotation.order = 'YXZ';

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.max(2, Math.min(4, Math.round(h / 360)));   // chunky ~640x360 look
    renderer.setPixelRatio(1);
    renderer.setSize(Math.ceil(w / s), Math.ceil(h / s), false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- helpers ---------- */
  function tex(w, h, draw, rx, ry) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    var t = new THREE.CanvasTexture(c);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestFilter;
    t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx || 1, ry || 1);
    return t;
  }
  function mat(map, color) {
    return new THREE.MeshPhongMaterial({ map: map || null, color: color || 0xffffff, flatShading: true, shininess: 0, specular: 0x000000 });
  }
  function speckle(g, w, h, n, colors) {
    for (var i = 0; i < n; i++) {
      g.fillStyle = colors[(rand() * colors.length) | 0];
      g.fillRect((rand() * w) | 0, (rand() * h) | 0, rand() < .3 ? 2 : 1, 1);
    }
  }
  function grassTex(rx, ry) {
    return tex(64, 64, function (g, w, h) {
      g.fillStyle = '#33502b'; g.fillRect(0, 0, w, h);
      speckle(g, w, h, 520, ['#2b4524', '#3b5c30', '#476b38', '#294020']);
    }, rx, ry);
  }
  function stoneTex(rx, ry) {
    return tex(64, 64, function (g, w, h) {
      g.fillStyle = '#6d7189'; g.fillRect(0, 0, w, h);
      speckle(g, w, h, 520, ['#60647c', '#7a7e97', '#575b72']);
      g.fillStyle = '#3a3d54';
      g.fillRect(0, 0, w, 2); g.fillRect(0, 32, w, 2);
      g.fillRect(0, 0, 2, 32); g.fillRect(32, 32, 2, 32);
    }, rx, ry);
  }

  /* ---------- sky: gouraud gradient dome, stars, moon ---------- */
  var skyGroup = new THREE.Group();
  scene.add(skyGroup);

  (function () {
    var geo = new THREE.SphereGeometry(180, 16, 12);
    var pos = geo.attributes.position, cols = [];
    var top = new THREE.Color(0x070b24), mid = new THREE.Color(0x2a2860), hor = new THREE.Color(FOG), c = new THREE.Color();
    for (var i = 0; i < pos.count; i++) {
      var y = pos.getY(i) / 180;
      if (y < 0) c.copy(hor);
      else if (y < 0.35) c.copy(hor).lerp(mid, y / 0.35);
      else c.copy(mid).lerp(top, Math.min(1, (y - 0.35) / 0.65));
      cols.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    skyGroup.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })));

    var sp = [];
    for (var s = 0; s < 220; s++) {
      var th = rand() * Math.PI * 2, y2 = 0.12 + rand() * 0.88, r = Math.sqrt(1 - y2 * y2);
      sp.push(Math.cos(th) * r * 170, y2 * 170, Math.sin(th) * r * 170);
    }
    var sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
    skyGroup.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, fog: false })));

    var dir = new THREE.Vector3(-0.55, 0.5, -0.65).normalize();
    var moon = new THREE.Mesh(new THREE.CircleGeometry(7, 16), new THREE.MeshBasicMaterial({ color: 0xeef3ff, fog: false }));
    moon.position.copy(dir).multiplyScalar(150);
    moon.lookAt(0, 0, 0);
    skyGroup.add(moon);

    var hc = document.createElement('canvas'); hc.width = hc.height = 64;
    var hg = hc.getContext('2d'), gr = hg.createRadialGradient(32, 32, 2, 32, 32, 32);
    gr.addColorStop(0, 'rgba(190,210,255,.8)'); gr.addColorStop(1, 'rgba(190,210,255,0)');
    hg.fillStyle = gr; hg.fillRect(0, 0, 64, 64);
    var halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(hc), blending: THREE.AdditiveBlending, fog: false, depthWrite: false, transparent: true }));
    halo.scale.set(60, 60, 1);
    halo.position.copy(dir).multiplyScalar(148);
    skyGroup.add(halo);

    var dl = new THREE.DirectionalLight(0xa8b8ff, 0.8);
    dl.position.copy(dir).multiplyScalar(60);
    scene.add(dl);
  })();

  scene.add(new THREE.HemisphereLight(0x9aa6ff, 0x3a3040, 0.85));

  /* ---------- ground, plaza, monolith ---------- */
  var R = N > 1 ? Math.max(15, 4.4 / Math.sin(Math.PI / N)) : 15;   // gate ring radius

  var ground = new THREE.Mesh(new THREE.CircleGeometry(110, 32), mat(grassTex(28, 28)));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  var plaza = new THREE.Mesh(new THREE.CylinderGeometry(9, 9.4, 0.4, 24), mat(stoneTex(6, 6)));
  plaza.position.y = 0;
  scene.add(plaza);

  var monoBase = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.8, 0.6, 8), mat(stoneTex(2, 1)));
  monoBase.position.y = 0.5;
  scene.add(monoBase);

  var mono = new THREE.Mesh(
    new THREE.OctahedronGeometry(1.5, 0),
    new THREE.MeshPhongMaterial({ color: 0x66e0ff, emissive: 0x1b7aa0, flatShading: true, shininess: 30, specular: 0x88ccff })
  );
  mono.scale.set(1, 1.9, 1);
  mono.position.y = 3.6;
  scene.add(mono);

  var monoLight = new THREE.PointLight(0x66e0ff, 1.1, 22);
  monoLight.position.set(0, 3.6, 0);
  scene.add(monoLight);

  /* ---------- gates ---------- */
  var COLORS = [0xff6a3a, 0x44d8ff, 0xb060ff, 0x5aff8a, 0xffd84a, 0xff5a9a];
  var groups = [], portals = [], gatePos = [], gateAng = [];

  function portalTex(hex) {
    var r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
    var c = document.createElement('canvas'); c.width = 16; c.height = 64;
    var x = c.getContext('2d'), img = x.createImageData(16, 64);
    for (var py = 0; py < 64; py++) for (var px = 0; px < 16; px++) {
      var v = 0.5 + 0.5 * Math.sin(py * 0.4 + Math.sin(px * 0.55) * 1.6);
      var edge = 1 - Math.abs(px - 7.5) / 8;
      var k = (0.3 + 0.7 * v) * Math.pow(Math.max(edge, 0), 0.6);
      var i = (py * 16 + px) * 4;
      img.data[i] = r * k; img.data[i + 1] = g * k; img.data[i + 2] = b * k; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    var t = new THREE.CanvasTexture(c);
    t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }

  function label(text) {
    var c = document.createElement('canvas'); c.width = 256; c.height = 64;
    var g = c.getContext('2d'), size = 30;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = 'bold ' + size + 'px Georgia, "Times New Roman", serif';
    while (g.measureText(text).width > 232 && size > 12) { size -= 2; g.font = 'bold ' + size + 'px Georgia, "Times New Roman", serif'; }
    g.lineJoin = 'round'; g.lineWidth = 7; g.strokeStyle = '#000';
    g.strokeText(text, 128, 34);
    g.fillStyle = '#ffe9a0';
    g.fillText(text, 128, 34);
    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, fog: false, depthWrite: false }));
    s.scale.set(8.4, 2.1, 1);
    return s;
  }

  var archMat = mat(stoneTex(1, 3), 0xc8cce0);
  var lintelMat = mat(stoneTex(3, 1), 0xc8cce0);
  var pathMat = mat(stoneTex(1, 5), 0xb0b4cc);

  links.forEach(function (a, i) {
    var ang = N > 1 ? i / N * Math.PI * 2 : 0;
    var col = COLORS[i % COLORS.length];
    var gx = Math.sin(ang) * R, gz = Math.cos(ang) * R;
    gateAng.push(ang); gatePos.push([gx, gz]);

    var grp = new THREE.Group();
    grp.position.set(gx, 0, gz);
    grp.rotation.y = ang + Math.PI;           // front of the gate faces the plaza
    grp.userData.gate = i;

    [-2.4, 2.4].forEach(function (x) {
      var p = new THREE.Mesh(new THREE.BoxGeometry(1.2, 7.2, 1.2), archMat);
      p.position.set(x, 3.6, 0); grp.add(p);
      var cap = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.4, 1.7), lintelMat);
      cap.position.set(x, 0.2, 0); grp.add(cap);
    });
    var lintel = new THREE.Mesh(new THREE.BoxGeometry(7, 1.2, 1.5), lintelMat);
    lintel.position.set(0, 7.8, 0); grp.add(lintel);
    var fin = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.8, 4), lintelMat);
    fin.position.set(0, 9.3, 0); fin.rotation.y = Math.PI / 4; grp.add(fin);

    var pt = portalTex(col);
    var pm = new THREE.MeshBasicMaterial({ map: pt, transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false, fog: false });
    var plane = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 7), pm);
    plane.position.set(0, 3.5, 0); grp.add(plane);
    portals.push({ tex: pt, mat: pm });

    var glow = new THREE.Mesh(new THREE.CircleGeometry(2.5, 12),
      new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.rotation.x = -Math.PI / 2; glow.position.set(0, 0.06, 2.3); grp.add(glow);

    var sign = label(a.textContent.trim());
    sign.position.set(0, 11.3, 0); grp.add(sign);

    scene.add(grp);
    groups.push(grp);

    var pl = new THREE.PointLight(col, 1.5, 20);
    pl.position.set(Math.sin(ang) * (R - 2.8), 3.5, Math.cos(ang) * (R - 2.8));
    scene.add(pl);

    var pathLen = R - 8.6;
    var path = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.12, pathLen), pathMat);
    path.position.set(Math.sin(ang) * (8.6 + pathLen / 2), 0.06, Math.cos(ang) * (8.6 + pathLen / 2));
    path.rotation.y = ang;
    scene.add(path);
  });

  /* ---------- trees, rocks ---------- */
  function nearGate(a) {
    for (var i = 0; i < gateAng.length; i++) {
      var d = Math.abs(((a - gateAng[i]) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI);
      if (Math.PI - d < 0.24) return true;
    }
    return false;
  }

  var trunkG = new THREE.CylinderGeometry(0.25, 0.35, 1.6, 5), trunkM = mat(null, 0x4a3320);
  var cone1 = new THREE.ConeGeometry(2.1, 3.1, 6), cone2 = new THREE.ConeGeometry(1.6, 2.7, 6), cone3 = new THREE.ConeGeometry(1.1, 2.3, 6);
  var leafMats = [mat(null, 0x1f4a35), mat(null, 0x255a3a), mat(null, 0x1a4030)];
  for (var t = 0; t < 80; t++) {
    var ta = rand() * Math.PI * 2, tr = R + 9 + rand() * 48;
    var tree = new THREE.Group(), lm = leafMats[(rand() * 3) | 0];
    var tk = new THREE.Mesh(trunkG, trunkM); tk.position.y = 0.8; tree.add(tk);
    var l1 = new THREE.Mesh(cone1, lm); l1.position.y = 2.9; tree.add(l1);
    var l2 = new THREE.Mesh(cone2, lm); l2.position.y = 4.5; tree.add(l2);
    var l3 = new THREE.Mesh(cone3, lm); l3.position.y = 5.9; tree.add(l3);
    var sc = 0.8 + rand() * 0.9;
    tree.scale.set(sc, sc, sc);
    tree.position.set(Math.sin(ta) * tr, 0, Math.cos(ta) * tr);
    tree.rotation.y = rand() * 6;
    scene.add(tree);
  }
  var rockG = new THREE.DodecahedronGeometry(1, 0), rockM = mat(null, 0x5c5f72);
  for (var k = 0; k < 40; k++) {
    var ra = rand() * Math.PI * 2, rr = 11 + rand() * (R + 6);
    if (nearGate(ra) && rr < R + 2) continue;
    var rock = new THREE.Mesh(rockG, rockM), rs = 0.4 + rand() * 1.1;
    rock.scale.set(rs * 1.3, rs * 0.8, rs);
    rock.position.set(Math.sin(ra) * rr, rs * 0.3, Math.cos(ra) * rr);
    rock.rotation.set(rand() * 3, rand() * 3, rand() * 3);
    scene.add(rock);
  }

  /* ---------- fireflies ---------- */
  var FF = 70, ffBase = [], ffPos = new Float32Array(FF * 3);
  for (var f = 0; f < FF; f++) {
    var fa = rand() * Math.PI * 2, fr = rand() * (R + 8);
    ffBase.push([Math.sin(fa) * fr, 0.6 + rand() * 3, Math.cos(fa) * fr, rand() * 6]);
  }
  var ffGeo = new THREE.BufferGeometry();
  ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
  scene.add(new THREE.Points(ffGeo, new THREE.PointsMaterial({ color: 0xd6ff7a, size: 3, sizeAttenuation: false, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false })));

  /* ---------- input ---------- */
  var px = 0, pz = 7, yaw = Math.PI, pitch = 0;
  var keys = {};
  var KEYMAP = { KeyW: 'w', ArrowUp: 'w', KeyS: 's', ArrowDown: 's', KeyA: 'a', KeyD: 'd', ArrowLeft: 'left', ArrowRight: 'right', ShiftLeft: 'shift', ShiftRight: 'shift' };

  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = KEYMAP[e.code];
    if (k) { keys[k] = true; if (e.code.indexOf('Arrow') === 0) e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) { var k = KEYMAP[e.code]; if (k) keys[k] = false; });
  window.addEventListener('blur', function () { keys = {}; });

  walkBtn.addEventListener('pointerdown', function (e) { keys.w = true; walkBtn.setPointerCapture(e.pointerId); });
  ['pointerup', 'pointercancel'].forEach(function (ev) { walkBtn.addEventListener(ev, function () { keys.w = false; }); });

  var ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  function pick(cx, cy) {
    var r = canvas.getBoundingClientRect();
    mouse.x = ((cx - r.left) / r.width) * 2 - 1;
    mouse.y = -((cy - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(mouse, camera);
    var hits = ray.intersectObjects(groups, true);
    if (!hits.length) return -1;
    var o = hits[0].object;
    while (o && o.userData.gate === undefined) o = o.parent;
    return o ? o.userData.gate : -1;
  }

  var hover = -1;
  function setHover(i) {
    if (i === hover) return;
    hover = i;
    hint.innerHTML = i >= 0 ? 'Enter: <b>' + links[i].textContent.trim() + '</b>' : HINT_DEFAULT;
    canvas.style.cursor = i >= 0 ? 'pointer' : 'grab';
  }
  links.forEach(function (a, i) {
    a.addEventListener('mouseenter', function () { setHover(i); });
    a.addEventListener('mouseleave', function () { setHover(-1); });
    a.addEventListener('focus', function () { setHover(i); });
    a.addEventListener('blur', function () { setHover(-1); });
  });

  var dragging = false, moved = 0, lx = 0, ly = 0;
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; moved = 0; lx = e.clientX; ly = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing';
  });
  canvas.addEventListener('pointermove', function (e) {
    if (dragging) {
      var dx = e.clientX - lx, dy = e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      yaw += dx * 0.005;
      pitch = Math.max(-1.1, Math.min(1.1, pitch + dy * 0.005));
    } else if (e.pointerType === 'mouse') {
      setHover(pick(e.clientX, e.clientY));
    }
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    canvas.style.cursor = hover >= 0 ? 'pointer' : 'grab';
    if (e.type === 'pointerup' && moved < 8) {
      var i = pick(e.clientX, e.clientY);
      if (i >= 0) go(i);
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  var navigating = false;
  function go(i) {
    if (navigating) return;
    navigating = true;
    fade.querySelector('span').textContent = 'Loading ' + links[i].textContent.trim() + '...';
    fade.classList.add('on');
    setTimeout(function () { window.location.href = links[i].href; }, reduced ? 30 : 480);
  }
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) { navigating = false; fade.classList.remove('on'); }
  });

  /* ---------- main loop ---------- */
  var last = performance.now(), time = 0, moving = false;

  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now; time += dt;

    var fwd  = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
    var side = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
    yaw += ((keys.left ? 1 : 0) - (keys.right ? 1 : 0)) * 1.9 * dt;

    var mx = -Math.sin(yaw) * fwd + Math.cos(yaw) * side;
    var mz = -Math.cos(yaw) * fwd - Math.sin(yaw) * side;
    var len = Math.sqrt(mx * mx + mz * mz);
    moving = len > 0.01;
    if (len > 1) { mx /= len; mz /= len; }
    var speed = (keys.shift ? 11 : 6.5) * dt;
    px += mx * speed; pz += mz * speed;

    var d = Math.sqrt(px * px + pz * pz), maxD = R + 22;
    if (d > maxD) { px *= maxD / d; pz *= maxD / d; }
    if (d < 3) { if (d < 0.001) { px = 0; pz = 3; } else { px *= 3 / d; pz *= 3 / d; } }

    if (!navigating && moving) {
      for (var g = 0; g < N; g++) {
        var ddx = px - gatePos[g][0], ddz = pz - gatePos[g][1];
        if (ddx * ddx + ddz * ddz < 2.4 * 2.4) { go(g); break; }
      }
    }

    camera.position.set(px, 1.7 + (moving && !reduced ? Math.sin(time * 9) * 0.05 : 0), pz);
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
    skyGroup.position.copy(camera.position);

    mono.rotation.y += dt * 0.6;
    mono.position.y = 3.6 + (reduced ? 0 : Math.sin(time * 1.2) * 0.3);
    monoLight.intensity = 1.0 + (reduced ? 0 : Math.sin(time * 2.3) * 0.15);

    for (var p = 0; p < portals.length; p++) {
      portals[p].tex.offset.y -= dt * (reduced ? 0.08 : 0.55);
      portals[p].mat.color.setScalar(p === hover ? 1.7 : 1);
    }

    if (!reduced) {
      for (var q = 0; q < FF; q++) {
        var b = ffBase[q];
        ffPos[q * 3]     = b[0] + Math.sin(time * 0.6 + b[3]) * 1.2;
        ffPos[q * 3 + 1] = b[1] + Math.sin(time * 0.9 + b[3] * 2) * 0.6;
        ffPos[q * 3 + 2] = b[2] + Math.cos(time * 0.5 + b[3]) * 1.2;
      }
    } else if (time < 0.2) {
      for (var z = 0; z < FF; z++) { ffPos[z * 3] = ffBase[z][0]; ffPos[z * 3 + 1] = ffBase[z][1]; ffPos[z * 3 + 2] = ffBase[z][2]; }
    }
    ffGeo.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
