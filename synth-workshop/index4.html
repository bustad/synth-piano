<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronicles of the Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --obsidian: #0a0809;
    --stone:    #2b2622;
    --bronze:   #8a6a2f;
    --gold:     #e3c27a;
    --gold-hi:  #fff2c0;
    --ember:    #ff8a2a;
    --mist:     #b9a77a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    min-height: 100vh;
    background: var(--obsidian);
    color: var(--mist);
    font-family: "Cinzel", "Trajan Pro", Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px 56px;
    position: relative;
    overflow-x: hidden;
  }

  /* ============================================================
     Backdrop: moonlit castle, fog, embers, vignette
     ============================================================ */
  .backdrop {
    position: fixed; inset: 0;
    z-index: 0;
  }
  .backdrop svg { width: 100%; height: 100%; display: block; }

  .fog {
    position: absolute;
    left: -30%; right: -30%;
    height: 40%;
    background:
      radial-gradient(ellipse 30% 50% at 20% 60%, rgba(150,170,190,.16), transparent 70%),
      radial-gradient(ellipse 35% 45% at 55% 50%, rgba(150,170,190,.12), transparent 70%),
      radial-gradient(ellipse 25% 55% at 85% 65%, rgba(150,170,190,.15), transparent 70%);
    animation: drift 60s ease-in-out infinite alternate;
  }
  .fog.a { bottom: 6%; }
  .fog.b { bottom: 22%; opacity: .7; animation-duration: 90s; animation-direction: alternate-reverse; }
  @keyframes drift { from { transform: translateX(-6%); } to { transform: translateX(6%); } }

  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.78) 100%);
    pointer-events: none;
  }

  .ember {
    position: fixed;
    bottom: -12px;
    width: var(--s); height: var(--s);
    border-radius: 50%;
    background: #ffb25a;
    box-shadow: 0 0 6px 2px rgba(255,130,30,.7);
    opacity: 0;
    z-index: 1;
    pointer-events: none;
    animation: rise var(--d) linear var(--delay) infinite;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0); opacity: 0; }
    10%  { opacity: 1; }
    80%  { opacity: .8; }
    100% { transform: translate(var(--x), -108vh); opacity: 0; }
  }

  /* ============================================================
     The menu
     ============================================================ */
  .menu {
    position: relative;
    z-index: 2;
    width: min(400px, 100%);
    text-align: center;
  }

  .title {
    margin: 0;
    font-weight: 900;
    font-size: clamp(34px, 8.5vw, 58px);
    line-height: 1.02;
    letter-spacing: 2px;
    background: linear-gradient(#fff4c8 0%, #f0c860 38%, #9a6a1a 50%, #e8c060 66%, #6a4410 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
            color: transparent;
    filter: drop-shadow(0 3px 0 #000) drop-shadow(0 0 16px rgba(255,150,40,.35));
  }

  .tagline {
    margin: 14px 0 0;
    font-size: 15px;
    letter-spacing: 5px;
    color: var(--mist);
    text-shadow: 0 2px 0 #000;
  }

  /* engraved divider with a diamond in the middle */
  .rule {
    position: relative;
    height: 14px;
    margin: 18px auto 20px;
    width: 86%;
  }
  .rule::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 6px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--bronze) 20%, var(--bronze) 80%, transparent);
    box-shadow: 0 1px 0 #000;
  }
  .rule::after {
    content: "";
    position: absolute; left: 50%; top: 1px;
    width: 12px; height: 12px;
    transform: translateX(-50%) rotate(45deg);
    background: linear-gradient(135deg, var(--gold-hi), #8a5a10);
    border: 1px solid #000;
    box-shadow: 0 0 10px rgba(255,150,40,.6);
  }

  /* ---------- Stone-and-bronze buttons ---------- */
  .menu ul { list-style: none; margin: 0; padding: 0; }
  .menu li { margin: 0 0 11px; }
  .menu li.gap { margin-top: 24px; }

  .btn {
    position: relative;
    display: block;
    height: 54px;
    line-height: 50px;
    padding: 0 40px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--gold);
    text-decoration: none;
    text-shadow: 0 2px 0 #000, 0 0 2px #000;
    background: linear-gradient(#4f463e 0%, #332d28 46%, #1f1b18 54%, #2d2824 100%);
    border: 2px solid;
    border-color: #c29c52 #4a3515 #3a2a10 #a3813f;
    box-shadow:
      inset 0 1px 0 rgba(255,236,170,.38),
      inset 0 -3px 8px rgba(0,0,0,.65),
      0 0 0 1px #000,
      0 5px 12px rgba(0,0,0,.7);
    outline: none;
    cursor: pointer;
    transition: box-shadow .12s, color .12s, background .12s;
  }
  /* rivets */
  .btn::before, .btn::after {
    content: "";
    position: absolute; top: 50%;
    width: 11px; height: 11px;
    margin-top: -5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #8a6a2f 55%, #2a1c08);
    box-shadow: 0 1px 2px #000;
  }
  .btn::before { left: 13px; }
  .btn::after  { right: 13px; }

  .btn:hover,
  .btn:focus-visible {
    color: var(--gold-hi);
    background: linear-gradient(#6a5c4a 0%, #473d33 46%, #2b241e 54%, #3d352d 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,244,200,.55),
      inset 0 -3px 8px rgba(0,0,0,.5),
      inset 0 0 22px rgba(255,140,40,.28),
      0 0 0 1px #000,
      0 0 22px rgba(255,138,42,.55),
      0 5px 12px rgba(0,0,0,.7);
  }
  .btn:hover::before, .btn:hover::after,
  .btn:focus-visible::before, .btn:focus-visible::after {
    background: radial-gradient(circle at 35% 30%, #fff, #ffb040 50%, #6a3a08);
    box-shadow: 0 0 8px 2px rgba(255,150,40,.85);
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow:
      inset 0 3px 10px rgba(0,0,0,.8),
      0 0 0 1px #000,
      0 2px 6px rgba(0,0,0,.7);
  }

  .footer {
    position: fixed;
    left: 0; right: 0; bottom: 14px;
    z-index: 2;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    color: #6b6354;
    text-shadow: 0 1px 0 #000;
  }

  @media (max-width: 420px) {
    .btn { font-size: 16px; padding: 0 34px; letter-spacing: 1px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fog, .ember { animation: none; }
    .ember { display: none; }
  }
</style>
</head>
<body>

<!-- ===================== BACKDROP ===================== -->
<div class="backdrop" aria-hidden="true">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#04060c"/>
        <stop offset=".45" stop-color="#0d1828"/>
        <stop offset=".78" stop-color="#26283a"/>
        <stop offset="1"   stop-color="#3b2f3a"/>
      </linearGradient>
      <radialGradient id="glow" cx=".5" cy=".5" r=".5">
        <stop offset="0"   stop-color="#bcd2ee" stop-opacity=".55"/>
        <stop offset=".4"  stop-color="#6f8fbf" stop-opacity=".18"/>
        <stop offset="1"   stop-color="#6f8fbf" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="1600" height="900" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#fff" opacity=".8">
      <circle cx="120" cy="90" r="1.3"/><circle cx="260" cy="170" r="1"/><circle cx="380" cy="60" r="1.5"/>
      <circle cx="520" cy="130" r="1"/><circle cx="640" cy="50" r="1.2"/><circle cx="760" cy="150" r="1"/>
      <circle cx="880" cy="80" r="1.4"/><circle cx="1010" cy="40" r="1"/><circle cx="1380" cy="120" r="1.3"/>
      <circle cx="1480" cy="60" r="1"/><circle cx="1540" cy="190" r="1.2"/><circle cx="1300" cy="230" r="1"/>
      <circle cx="70" cy="260" r="1"/><circle cx="460" cy="260" r="1.1"/>
    </g>

    <!-- moon -->
    <circle cx="1170" cy="190" r="300" fill="url(#glow)"/>
    <circle cx="1170" cy="190" r="58" fill="#e6eef8"/>
    <circle cx="1150" cy="175" r="10" fill="#c5d3e6"/>
    <circle cx="1190" cy="212" r="14" fill="#c5d3e6"/>
    <circle cx="1182" cy="164" r="6"  fill="#d0dcec"/>

    <!-- far mountains -->
    <polygon fill="#152233" points="0,640 120,560 260,610 420,520 600,600 760,540 940,610 1100,530 1300,600 1460,540 1600,590 1600,900 0,900"/>

    <!-- castle on a hill -->
    <g transform="translate(1180,430)" fill="#070b12">
      <polygon points="-50,220 -10,175 270,175 310,220"/>
      <rect x="0" y="60" width="34" height="120"/>
      <polygon points="-4,60 17,18 38,60"/>
      <rect x="40" y="100" width="90" height="80"/>
      <polygon points="40,100 85,70 130,100"/>
      <rect x="130" y="50" width="30" height="130"/>
      <polygon points="126,50 145,6 164,50"/>
      <rect x="160" y="122" width="80" height="58"/>
      <rect x="240" y="80" width="26" height="100"/>
      <polygon points="236,80 253,38 270,80"/>
      <g fill="#ffb347">
        <rect x="12" y="90" width="5" height="9"/>
        <rect x="140" y="80" width="5" height="9"/>
        <rect x="140" y="110" width="5" height="9"/>
        <rect x="70"  y="130" width="6" height="10"/>
        <rect x="249" y="110" width="5" height="9"/>
      </g>
    </g>

    <!-- near mountains -->
    <polygon fill="#0c141f" points="0,700 180,630 340,690 520,610 700,700 880,640 1060,700 1240,640 1440,700 1600,660 1600,900 0,900"/>

    <!-- foreground ground + pines -->
    <polygon fill="#05080c" points="0,820 300,790 700,830 1100,800 1600,830 1600,900 0,900"/>
    <g fill="#05080c">
      <polygon points="30,830 66,720 52,720 90,620 74,620 116,510 158,620 142,620 180,720 166,720 202,830"/>
      <polygon points="150,840 176,760 164,760 192,680 180,680 210,600 240,680 228,680 256,760 244,760 270,840"/>
      <polygon points="1380,840 1412,740 1398,740 1432,640 1418,640 1456,540 1494,640 1480,640 1514,740 1500,740 1532,840"/>
      <polygon points="1500,850 1530,760 1518,760 1550,670 1538,670 1572,590 1606,670 1594,670 1624,760 1612,760 1640,850"/>
    </g>
  </svg>
  <div class="fog a"></div>
  <div class="fog b"></div>
  <div class="vignette"></div>
</div>

<!-- ===================== MENU ===================== -->
<main class="menu">
  <h1 class="title">Chronicles<br>of the Index</h1>
  <p class="tagline">Choose your path</p>
  <div class="rule"></div>

  <!--
    ============================================================
    EDIT HERE: change href="" to point at your own .html files,
    and change the button text. Add or remove <li> items freely.
    ============================================================
  -->
  <nav aria-label="Main menu">
    <ul>
      <li><a class="btn" href="page1.html">New Campaign</a></li>
      <li><a class="btn" href="page2.html">Load Game</a></li>
      <li><a class="btn" href="page3.html">Bestiary</a></li>
      <li><a class="btn" href="page4.html">Options</a></li>
      <li><a class="btn" href="page5.html">Credits</a></li>
      <li class="gap"><a class="btn" href="page6.html">Exit to Desktop</a></li>
    </ul>
  </nav>
</main>

<div class="footer">Version 1.0.3 &nbsp; Best played at 1024 x 768</div>

<script>
  // A handful of embers drifting up the screen
  (function () {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (var i = 0; i < 20; i++) {
      var e = document.createElement('span');
      e.className = 'ember';
      e.style.left = (Math.random() * 100) + 'vw';
      e.style.setProperty('--s', (2 + Math.random() * 3).toFixed(1) + 'px');
      e.style.setProperty('--d', (9 + Math.random() * 10).toFixed(1) + 's');
      e.style.setProperty('--delay', (-Math.random() * 18).toFixed(1) + 's');
      e.style.setProperty('--x', ((Math.random() - 0.5) * 160).toFixed(0) + 'px');
      document.body.appendChild(e);
    }
  })();
</script>
</body>
</html>
