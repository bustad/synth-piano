<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Secret of the Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:      #000000;
    --verb:     #aa55ff;   /* idle verb colour */
    --verb-hi:  #ff77ff;   /* hovered verb colour */
    --sentence: #55ffff;   /* sentence line */
    --gold:     #ffcc33;
    --gold-dk:  #b86a10;
    --frame:    #2a1a0a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: "VT323", "Courier New", monospace;
    cursor: crosshair;
  }

  /* ============================================================
     The game window: 4:3-ish, scene on top, interface on the bottom
     ============================================================ */
  .game {
    width: min(860px, 100%);
    background: var(--ink);
    border: 6px solid var(--frame);
    outline: 2px solid #5a3a1a;
    box-shadow: 0 0 0 10px #000, 0 20px 60px rgba(0, 0, 0, .8);
  }

  /* ---------- Scene ---------- */
  .scene {
    position: relative;
    line-height: 0;
    background: #1a0a3c;
  }
  .scene svg {
    display: block;
    width: 100%;
    height: auto;
    shape-rendering: crispEdges;
  }

  .title {
    position: absolute;
    left: 0; right: 0; top: 5%;
    text-align: center;
    line-height: 1;
    pointer-events: none;
  }
  .title h1 {
    margin: 0;
    font-family: "IM Fell English SC", Georgia, "Times New Roman", serif;
    font-weight: normal;
    font-size: clamp(28px, 7.4vw, 66px);
    letter-spacing: 1px;
    color: var(--gold);
    /* hard black outline + warm drop shadow, like the old title cards */
    text-shadow:
      -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
      0 -3px 0 #000, 0 3px 0 #000, -3px 0 0 #000, 3px 0 0 #000,
      0 6px 0 var(--gold-dk), 0 9px 0 #000;
  }
  .title p {
    margin: 14px 0 0;
    font-family: "IM Fell English SC", Georgia, serif;
    font-size: clamp(13px, 2.6vw, 22px);
    letter-spacing: 3px;
    color: #fff0c0;
    text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
  }

  .star { animation: twinkle 3.2s steps(1) infinite; }
  .star:nth-child(2n)   { animation-delay: .9s; }
  .star:nth-child(3n)   { animation-delay: 1.7s; }
  @keyframes twinkle { 0%, 70% { opacity: 1; } 78%, 90% { opacity: .15; } }

  /* ---------- Interface ---------- */
  .ui {
    background: var(--ink);
    border-top: 4px solid var(--frame);
    padding: 8px 18px 16px;
  }

  .sentence {
    text-align: center;
    min-height: 1.1em;
    margin: 0 0 8px;
    font-size: clamp(26px, 4.2vw, 36px);
    line-height: 1.1;
    color: var(--sentence);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .verbs {
    list-style: none;
    margin: 0 auto;
    padding: 0;
    max-width: 720px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0 18px;
  }
  .verbs a {
    display: block;
    padding: 1px 6px;
    font-size: clamp(26px, 4vw, 34px);
    line-height: 1.12;
    color: var(--verb);
    text-decoration: none;
    outline: none;
    cursor: crosshair;
  }
  .verbs a:hover,
  .verbs a:focus-visible {
    color: var(--verb-hi);
    background: #1a0a2a;
  }
  .verbs a:active { color: #fff; }

  .hint {
    margin: 10px 0 0;
    text-align: center;
    font-size: 20px;
    color: #6a4a8a;
  }

  @media (max-width: 560px) {
    .verbs { grid-template-columns: repeat(2, 1fr); gap: 0 8px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .star { animation: none; }
  }
</style>
</head>
<body>

<main class="game">

  <!-- ===================== SCENE ===================== -->
  <div class="scene">
    <svg id="art" viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pixel-art island at sunset with a sailing ship"></svg>
    <div class="title">
      <h1>The Secret<br>of the Index</h1>
      <p>Choose where to sail</p>
    </div>
  </div>

  <!-- ===================== INTERFACE ===================== -->
  <div class="ui">
    <div class="sentence" id="sentence">Walk to</div>

    <!--
      ============================================================
      EDIT HERE: change href="" to point at your own .html files
      and change the link text. Add or remove <li> items freely.
      Whatever the link text says appears in the sentence line.
      ============================================================
    -->
    <ul class="verbs">
      <li><a href="synth-workshop.html">The Tavern</a></li>
      <li><a href="webaudio-piano.html">The Map Room</a></li>
      <li><a href="index2.html">Lookout Point</a></li>
      <li><a href="index3.html">The Shipyard</a></li>
      <li><a href="page5.html">Voodoo Shop</a></li>
      <li><a href="page6.html">Captain's Log</a></li>
    </ul>

    <p class="hint">Click a destination, or press Tab to cycle</p>
  </div>

</main>

<script>
  /* ---------- Sentence line: "Walk to <thing>" ---------- */
  (function () {
    var line = document.getElementById('sentence');
    var base = 'Walk to';
    var links = document.querySelectorAll('.verbs a');
    function set(t) { line.textContent = t ? base + ' ' + t : base; }
    Array.prototype.forEach.call(links, function (a) {
      a.addEventListener('mouseenter', function () { set(a.textContent); });
      a.addEventListener('focus',      function () { set(a.textContent); });
      a.addEventListener('mouseleave', function () { set(''); });
      a.addEventListener('blur',       function () { set(''); });
    });
  })();

  /* ---------- Scene: stepped, dithered pixel-art sunset ---------- */
  (function () {
    var W = 320, H = 150, HORIZON = 84;
    var sky = ['#12062e','#1e0a46','#2e1062','#46187a','#661e86','#8a2a88','#b03a80','#d4526a','#ee7352','#ff9a4a','#ffbf5e','#ffdc84'];
    var sea = ['#3c2670','#2e1f66','#241a5a','#1a154c','#130f3c','#0d0a2c'];
    var out = '', defs = '';

    function mix(a, b, id) {
      defs += '<pattern id="' + id + '" width="2" height="2" patternUnits="userSpaceOnUse">' +
              '<rect width="2" height="2" fill="' + a + '"/>' +
              '<rect width="1" height="1" fill="' + b + '"/><rect x="1" y="1" width="1" height="1" fill="' + b + '"/></pattern>';
    }

    /* sky bands, with a 2px checker dither at every seam */
    var bh = HORIZON / sky.length;
    sky.forEach(function (c, i) {
      var y = Math.round(i * bh), y2 = Math.round((i + 1) * bh);
      out += '<rect x="0" y="' + y + '" width="' + W + '" height="' + (y2 - y) + '" fill="' + c + '"/>';
      if (i < sky.length - 1) {
        mix(c, sky[i + 1], 'ds' + i);
        out += '<rect x="0" y="' + (y2 - 2) + '" width="' + W + '" height="2" fill="url(#ds' + i + ')"/>';
      }
    });

    /* stars */
    var stars = [[14,6],[40,14],[72,4],[96,18],[128,8],[150,22],[176,5],[204,12],[236,6],[262,16],[290,5],[306,20],[58,28],[222,26]];
    stars.forEach(function (s) {
      out += '<rect class="star" x="' + s[0] + '" y="' + s[1] + '" width="1" height="1" fill="#fff"/>';
    });

    /* sun, half-sunk into the sea */
    var sx = 196;
    out += '<circle cx="' + sx + '" cy="' + HORIZON + '" r="19" fill="#ffb347"/>' +
           '<circle cx="' + sx + '" cy="' + HORIZON + '" r="14" fill="#ffd966"/>' +
           '<circle cx="' + sx + '" cy="' + HORIZON + '" r="9"  fill="#fff0a8"/>';

    /* sea bands */
    var sh = (H - HORIZON) / sea.length;
    sea.forEach(function (c, i) {
      var y = Math.round(HORIZON + i * sh), y2 = Math.round(HORIZON + (i + 1) * sh);
      out += '<rect x="0" y="' + y + '" width="' + W + '" height="' + (y2 - y) + '" fill="' + c + '"/>';
      if (i < sea.length - 1) {
        mix(c, sea[i + 1], 'dw' + i);
        out += '<rect x="0" y="' + (y2 - 2) + '" width="' + W + '" height="2" fill="url(#dw' + i + ')"/>';
      }
    });

    /* sun glitter on the water */
    for (var r = 0; r < 14; r++) {
      var y = HORIZON + 2 + r * 4.4;
      var w = 30 - r * 1.6; if (w < 4) w = 4;
      var shift = (r % 2) ? 5 : -4;
      out += '<rect x="' + Math.round(sx - w / 2 + shift) + '" y="' + Math.round(y) + '" width="' + Math.round(w) + '" height="1" fill="#ffc874" opacity="' + (0.85 - r * 0.045).toFixed(2) + '"/>';
    }

    /* far-off island nub on the horizon */
    out += '<polygon points="268,' + HORIZON + ' 276,78 284,76 294,79 304,' + HORIZON + '" fill="#2a1450"/>';

    /* main island, left: cliff + lookout */
    out += '<polygon fill="#0b0720" points="0,150 0,52 8,50 14,44 22,42 26,34 36,32 40,40 50,44 56,52 68,58 82,68 100,76 124,86 150,92 150,150"/>';
    /* lighter rim light on the cliff top */
    out += '<polygon fill="#2a1450" points="14,44 22,42 26,34 36,32 36,34 27,36 23,44 15,46"/>';
    /* lookout hut + glowing window */
    out += '<rect x="30" y="26" width="10" height="7" fill="#0b0720"/>' +
           '<polygon fill="#0b0720" points="28,26 35,21 42,26"/>' +
           '<rect x="34" y="28" width="3" height="3" fill="#ffd45a"/>';
    /* palm tree */
    out += '<polygon fill="#0b0720" points="84,70 86,70 88,56 90,44 91,44 90,57 87,72 85,72"/>' +
           '<polygon fill="#0b0720" points="90,44 102,42 112,46 120,54 112,49 102,46 94,47"/>' +
           '<polygon fill="#0b0720" points="90,44 80,40 70,42 62,50 71,45 80,44 88,47"/>' +
           '<polygon fill="#0b0720" points="90,44 98,34 108,32 114,36 106,35 98,38 92,46"/>' +
           '<polygon fill="#0b0720" points="90,44 84,34 76,31 68,34 77,35 84,38 89,46"/>' +
           '<polygon fill="#0b0720" points="90,43 92,32 96,28 94,34 92,44"/>';
    /* dock, jutting from the island */
    out += '<rect x="100" y="86" width="52" height="2" fill="#0b0720"/>';
    for (var p = 0; p < 6; p++) out += '<rect x="' + (104 + p * 9) + '" y="88" width="2" height="7" fill="#0b0720"/>';

    /* sailing ship silhouette, right */
    out += '<polygon fill="#0b0720" points="226,100 296,100 288,108 234,108"/>' +
           '<rect x="258" y="68" width="2" height="33" fill="#0b0720"/>' +
           '<rect x="240" y="76" width="2" height="25" fill="#0b0720"/>' +
           '<rect x="276" y="78" width="2" height="23" fill="#0b0720"/>' +
           '<polygon fill="#0b0720" points="259,70 259,92 280,92 276,72"/>' +
           '<polygon fill="#0b0720" points="257,72 257,92 242,92 244,76"/>' +
           '<polygon fill="#0b0720" points="277,80 277,94 292,94 288,82"/>' +
           '<polygon fill="#0b0720" points="258,68 258,63 266,66"/>';
    /* ship reflection */
    out += '<rect x="236" y="110" width="52" height="1" fill="#0b0720" opacity=".5"/>' +
           '<rect x="242" y="113" width="40" height="1" fill="#0b0720" opacity=".35"/>' +
           '<rect x="250" y="116" width="26" height="1" fill="#0b0720" opacity=".2"/>';

    document.getElementById('art').innerHTML = '<defs>' + defs + '</defs>' + out;
  })();
</script>
</body>
</html>
