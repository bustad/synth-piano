<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program Manager</title>
<style>
  :root {
    --desktop: #008080;
    --face:    #c0c0c0;
    --hilite:  #ffffff;
    --shadow:  #808080;
    --frame:   #000000;
    --title:   #000080;
    --text:    #000000;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    min-height: 100vh;
    background: var(--desktop);
    color: var(--text);
    font-family: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Arial, Helvetica, sans-serif;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  /* ============================================================
     Window chrome (shared by Program Manager and the group window)
     ============================================================ */
  .win {
    background: var(--face);
    border: 1px solid var(--frame);
    padding: 3px;
    box-shadow: inset 1px 1px 0 var(--hilite), inset -1px -1px 0 var(--shadow);
  }

  .titlebar {
    display: flex;
    align-items: stretch;
    height: 20px;
    background: var(--title);
    color: #fff;
    font-weight: bold;
    font-size: 14px;
  }
  .titlebar .name {
    flex: 1;
    text-align: center;
    line-height: 20px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* little beveled buttons */
  .btn {
    width: 20px;
    background: var(--face);
    border: 1px solid var(--frame);
    box-shadow: inset 1px 1px 0 var(--hilite), inset -1px -1px 0 var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  /* control-menu box: the little "dash in a box" at the far left */
  .ctrl::before {
    content: "";
    width: 10px; height: 4px;
    background: var(--face);
    border: 1px solid var(--frame);
    box-shadow: inset 1px 1px 0 var(--hilite), inset -1px -1px 0 var(--shadow);
  }
  /* minimise / maximise triangles */
  .min::before, .max::before { content: ""; border-left: 4px solid transparent; border-right: 4px solid transparent; }
  .min::before { border-top: 5px solid #000; }
  .max::before { border-bottom: 5px solid #000; }

  /* ============================================================
     Program Manager
     ============================================================ */
  .pm { width: min(720px, 100%); }

  .menubar {
    background: #fff;
    border-bottom: 1px solid var(--frame);
    display: flex;
    gap: 2px;
    padding: 1px 4px;
    margin-top: 0;
  }
  .menubar span { padding: 1px 8px 2px; }
  .menubar u { text-decoration: underline; }

  .workspace {
    background: var(--shadow);
    border: 1px solid var(--frame);
    box-shadow: inset 1px 1px 0 #404040;
    padding: 16px;
    min-height: 340px;
  }

  /* ============================================================
     Group window: "Main"
     ============================================================ */
  .group { width: 100%; }

  .client {
    background: #fff;
    border: 1px solid var(--frame);
    padding: 18px 12px 14px;
    min-height: 280px;
  }

  .icons {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap: 20px 6px;
    justify-items: center;
  }

  .icons a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    width: 104px;
    color: var(--text);
    text-decoration: none;
    text-align: center;
    outline: none;
    cursor: pointer;
  }
  .icons svg {
    width: 64px; height: 64px;
    shape-rendering: crispEdges;
    display: block;
  }
  .icons .label {
    padding: 1px 4px 2px;
    line-height: 1.15;
    border: 1px solid transparent;
  }

  /* "selected" look: navy label, white text */
  .icons a:hover .label,
  .icons a:focus-visible .label,
  .icons a:active .label {
    background: var(--title);
    color: #fff;
  }
  .icons a:focus-visible .label {
    border: 1px dotted #fff;
    outline: 1px dotted #000;
    outline-offset: 0;
  }

  @media (max-width: 480px) {
    body { padding: 8px; }
    .workspace { padding: 8px; }
    .icons { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- Icon art, drawn once and reused below -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Read Me: a page with a folded corner -->
  <symbol id="i-doc" viewBox="0 0 32 32">

    <rect x="14" y="3" width="2" height="5" fill="#808080" stroke="#000"/>

    <rect x="8" y="12" width="13" height="1" fill="#000080"/>
    <rect x="8" y="16" width="11" height="1" fill="#000080"/>
    <rect x="8" y="20" width="12" height="1" fill="#000080"/>
    <polygon points="19,27 25,12 28,14 22,29" fill="#ffff00" stroke="#000"/>
    <polygon points="19,27 22,29 18,30" fill="#ffd8a0" stroke="#000"/>

  <!-- Calculator -->
  <symbol id="i-calc" viewBox="0 0 32 32">
    <rect x="7" y="3" width="18" height="26" fill="#c0c0c0" stroke="#000"/>
    <rect x="10" y="6" width="12" height="5" fill="#a8d8a8" stroke="#000"/>
    <rect x="10" y="14" width="4" height="3" fill="#000080"/>
    <rect x="15" y="14" width="4" height="3" fill="#000080"/>
    <rect x="20" y="14" width="3" height="3" fill="#800000"/>
    <rect x="10" y="19" width="4" height="3" fill="#000080"/>
    <rect x="15" y="19" width="4" height="3" fill="#000080"/>
    <rect x="20" y="19" width="3" height="3" fill="#800000"/>
    <rect x="10" y="24" width="4" height="3" fill="#000080"/>
    <rect x="15" y="24" width="4" height="3" fill="#000080"/>
    <rect x="20" y="24" width="3" height="3" fill="#800000"/>
  </symbol>

  <!-- Games: two playing cards -->
  <symbol id="i-cards" viewBox="0 0 32 32">
    <rect x="5" y="8" width="14" height="19" fill="#fff" stroke="#000"/>
    <rect x="9" y="6" width="15" height="20" fill="#fff" stroke="#000"/>
    <rect x="13" y="4" width="14" height="20" fill="#fff" stroke="#000"/>
    <polygon points="20,8 24,14 20,20 16,14" fill="#ff0000"/>
    <rect x="15" y="6" width="2" height="2" fill="#ff0000"/>
    <rect x="23" y="20" width="2" height="2" fill="#ff0000"/>
  </symbol>
</svg>

<main class="win pm">

  <div class="titlebar">
    <div class="btn ctrl"></div>
    <div class="name">Program Manager</div>
    <div class="btn min"></div>
    <div class="btn max"></div>
  </div>

  <div class="menubar" aria-hidden="true">
    <span><u>F</u>ile</span>
    <span><u>O</u>ptions</span>
    <span><u>W</u>indow</span>
    <span><u>H</u>elp</span>
  </div>

  <div class="workspace">

    <section class="win group" aria-label="Main">
      <div class="titlebar">
        <div class="btn ctrl"></div>
        <div class="name">Main</div>
        <div class="btn min"></div>
        <div class="btn max"></div>
      </div>

      <div class="client">

        <!--
          ============================================================
          EDIT HERE: change href="" to point at your own .html files,
          and change the label text. Add or remove <li> items freely.
          To change an icon, swap the id in <use href="#i-...">.
          Icons available: i-doc, i-cabinet, i-monitor, i-write,
                           i-calc, i-cards
          ============================================================
        -->
        <ul class="icons">
          <li><a href="page1.html"><svg><use href="#i-doc"/></svg><span class="label">Read Me</span></a></li>
          <li><a href="page2.html"><svg><use href="#i-cabinet"/></svg><span class="label">File Manager</span></a></li>
          <li><a href="page3.html"><svg><use href="#i-monitor"/></svg><span class="label">Control Panel</span></a></li>
          <li><a href="page4.html"><svg><use href="#i-write"/></svg><span class="label">Write</span></a></li>
          <li><a href="page5.html"><svg><use href="#i-calc"/></svg><span class="label">Calculator</span></a></li>
          <li><a href="page6.html"><svg><use href="#i-cards"/></svg><span class="label">Games</span></a></li>
        </ul>

      </div>
    </section>

  </div>
</main>

</body>
</html>
