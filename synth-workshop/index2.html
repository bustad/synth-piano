<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAIN MENU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     VGA-ish 16-colour palette
     ============================================================ */
  :root {
    --black:   #000000;
    --navy:    #0000aa;
    --deep:    #000055;
    --cyan:    #55ffff;
    --teal:    #00aaaa;
    --white:   #ffffff;
    --grey:    #aaaaaa;
    --dgrey:   #555555;
    --yellow:  #ffff55;
    --orange:  #ff5555;
    --magenta: #aa00aa;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--black);
    color: var(--grey);
    font-family: "VT323", "Courier New", monospace;
    font-size: 26px;
    line-height: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  /* CRT scanlines + vignette */
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
    z-index: 10;
  }

  /* ============================================================
     The "screen": dithered blue backdrop
     ============================================================ */
  .screen {
    position: relative;
    width: min(760px, 100%);
    padding: 28px 28px 20px;
    background:
      linear-gradient(45deg, var(--deep) 25%, transparent 25%, transparent 75%, var(--deep) 75%) 0 0 / 8px 8px,
      linear-gradient(45deg, var(--deep) 25%, transparent 25%, transparent 75%, var(--deep) 75%) 4px 4px / 8px 8px,
      var(--navy);
    border: 4px solid var(--grey);
    box-shadow:
      inset 0 0 0 4px var(--black),
      inset 0 0 0 6px var(--teal),
      8px 8px 0 var(--dgrey);
  }

  /* ============================================================
     Title logo – chunky bevelled pixel type
     ============================================================ */
  .logo {
    text-align: center;
    margin: 6px 0 4px;
  }
  .logo h1 {
    margin: 0;
    font-family: "Press Start 2P", "Courier New", monospace;
    font-weight: normal;
    font-size: clamp(26px, 7.5vw, 54px);
    letter-spacing: 2px;
    line-height: 1.15;
    color: var(--yellow);
    text-shadow:
      2px 2px 0 var(--orange),
      4px 4px 0 var(--magenta),
      6px 6px 0 var(--deep),
      8px 8px 0 var(--black);
    animation: flicker 6s steps(1) infinite;
  }
  .logo .sub {
    font-family: "Press Start 2P", "Courier New", monospace;
    font-size: clamp(8px, 2vw, 11px);
    color: var(--cyan);
    margin-top: 22px;
    letter-spacing: 3px;
  }

  @keyframes flicker {
    0%, 93%, 96%, 100% { opacity: 1; }
    94%, 97% { opacity: .78; }
  }

  /* ============================================================
     Menu window – double-line DOS border
     ============================================================ */
  .window {
    margin: 26px auto 0;
    max-width: 540px;
    background: var(--black);
    padding: 8px;
    border: 4px double var(--cyan);
    box-shadow: 6px 6px 0 var(--black);
  }
  .window-title {
    background: var(--teal);
    color: var(--black);
    text-align: center;
    margin: -8px -8px 10px;
    padding: 2px 0 3px;
    font-size: 24px;
  }

  nav ul { list-style: none; margin: 0; padding: 0; }

  nav a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 7px 12px 8px;
    color: var(--grey);
    text-decoration: none;
    outline: none;
    cursor: pointer;
  }
  nav a .arrow {
    width: 1ch;
    color: transparent;
    font-family: "Press Start 2P", monospace;
    font-size: 16px;
  }
  nav a .key {
    color: var(--yellow);
  }
  nav a .desc {
    margin-left: auto;
    color: var(--dgrey);
    font-size: 22px;
  }

  /* the selection bar */
  nav a:hover,
  nav a:focus-visible,
  nav a.sel {
    background: var(--cyan);
    color: var(--black);
  }
  nav a:hover .key,
  nav a:focus-visible .key,
  nav a.sel .key { color: var(--navy); }
  nav a:hover .desc,
  nav a:focus-visible .desc,
  nav a.sel .desc { color: var(--deep); }
  nav a:hover .arrow,
  nav a:focus-visible .arrow,
  nav a.sel .arrow {
    color: var(--orange);
    animation: blink 1s steps(1) infinite;
  }
  nav a:active { background: var(--yellow); }

  @keyframes blink { 50% { opacity: 0; } }

  .divider {
    height: 0;
    margin: 6px 0;
    border-top: 4px double var(--teal);
  }

  /* ============================================================
     Status bar
     ============================================================ */
  .status {
    margin-top: 26px;
    padding: 3px 10px 4px;
    background: var(--grey);
    color: var(--black);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 22px;
  }
  .status b { color: var(--navy); font-weight: normal; }
  .cursor { display: inline-block; width: .6ch; height: 1em; background: var(--black); vertical-align: -2px; animation: blink 1s steps(1) infinite; }

  .copy {
    text-align: center;
    margin-top: 14px;
    font-size: 20px;
    color: var(--cyan);
  }

  @media (max-width: 520px) {
    body { font-size: 22px; }
    nav a .desc { display: none; }
    .screen { padding: 20px 14px 14px; }
    .status { font-size: 19px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo h1, .cursor, nav .arrow { animation: none !important; }
  }
</style>
</head>
<body>

<main class="screen">

  <header class="logo">
    <h1>YOUR<br>GAME</h1>
    <div class="sub">A VGA ADVENTURE</div>
  </header>

  <div class="window">
    <div class="window-title">MAIN MENU</div>

    <!--
      ============================================================

    -->
    <nav aria-label="Main menu">
      <ul>
        <li><a href="synth-workshop.html"><span class="arrow">&#9658;</span><span><span class="key">N</span>ew Game</span><span class="desc">page1.html</span></a></li>
        <li><a href="webaudio-piano.html"><span class="arrow">&#9658;</span><span><span class="key">L</span>oad Game</span><span class="desc">page2.html</span></a></li>
        <li><a href="web-audio-synth-explained.md"><span class="arrow">&#9658;</span><span><span class="key">O</span>ptions</span><span class="desc">page3.html</span></a></li>
        <li><a href="page4.html"><span class="arrow">&#9658;</span><span><span class="key">H</span>igh Scores</span><span class="desc">page4.html</span></a></li>
        <li><a href="page5.html"><span class="arrow">&#9658;</span><span><span class="key">C</span>redits</span><span class="desc">page5.html</span></a></li>
        <li class="divider" role="presentation"></li>
        <li><a href="page6.html"><span class="arrow">&#9658;</span><span><span class="key">Q</span>uit to DOS</span><span class="desc">page6.html</span></a></li>
      </ul>
    </nav>
  </div>

  <div class="status">
    <span><b>&uarr;&darr;</b> Select</span>
    <span><b>ENTER</b> Confirm</span>
    <span><b>HOTKEY</b> Jump<span class="cursor"></span></span>
  </div>

  <div class="copy">640K OK &mdash; VGA 256 COLORS</div>

</main>

<script>
  // Keyboard navigation: arrows to move, Enter to follow, first letter as hotkey.
  (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll('nav a'));
    var i = 0;

    function select(n) {
      i = (n + links.length) % links.length;
      links.forEach(function (a) { a.classList.remove('sel'); });
      links[i].classList.add('sel');
    }

    links.forEach(function (a, n) {
      a.addEventListener('mouseenter', function () { select(n); });
      a.addEventListener('focus', function () { select(n); });
    });

    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var k = e.key;
      if (k === 'ArrowDown') { e.preventDefault(); select(i + 1); }
      else if (k === 'ArrowUp') { e.preventDefault(); select(i - 1); }
      else if (k === 'Enter' && document.activeElement.tagName !== 'A') { links[i].click(); }
      else if (k.length === 1) {
        var ch = k.toUpperCase();
        for (var n = 0; n < links.length; n++) {
          var hot = links[n].querySelector('.key');
          if (hot && hot.textContent.toUpperCase() === ch) { select(n); links[n].click(); break; }
        }
      }
    });

    select(0);
  })();
</script>
</body>
</html>
